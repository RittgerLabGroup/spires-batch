[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "spires-batch"
dynamic = ["version"]  # version derived from git tags via setuptools_scm
description = "SPIReS batch processing: run the retrieval at scale over stacks of granules and spacetime cubes"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "slurm", "batch", "SPIRES"]

dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest"]
science = [
    "spires-contract @ git+https://github.com/SPIReS-Organization/spires-contract.git@main",
    "spires-io @ git+https://github.com/SPIReS-Organization/spires-io.git@main",
    "spires-r0 @ git+https://github.com/SPIReS-Organization/spires-r0.git@main",
    "spires-inversion @ git+https://github.com/SPIReS-Organization/spires-inversion.git@main",
    "spires-postprocess @ git+https://github.com/SPIReS-Organization/spires-postprocess.git@main",
]

[project.scripts]
spires-batch = "spires_batch.cli:main"

[project.urls]
Homepage = "https://github.com/SPIReS-Organization/spires-batch"
Repository = "https://github.com/SPIReS-Organization/spires-batch"

[tool.setuptools.packages.find]
where = ["."]
include = ["spires_batch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
