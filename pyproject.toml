[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "spires-batch"
dynamic = ["version"]  # version derived from git tags via setuptools_scm
description = "SPIReS batch processing: run the retrieval at scale over stacks of granules and spacetime cubes"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "slurm", "batch", "SPIRES"]

dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest"]
interpolation = [
    "spires-interpolation[io,netcdf] @ git+https://github.com/RittgerLabGroup/spires-interpolation.git@60c54f89f5fe952cab7d5328da6e6ad1e47669e0",
]
science = [
    "spires-contract @ git+https://github.com/RittgerLabGroup/spires-contract.git@dda5155c9af5d4976d67de0fb6de1ff1d73d080d",
    "spires-io @ git+https://github.com/RittgerLabGroup/spires-io.git@2778eac9171fde9c9d67350731349f438a9cf56f",
    "spires-r0 @ git+https://github.com/RittgerLabGroup/spires-r0.git@70b96648ebb0127ae9d84a4a0586754d2aa57a19",
    "spires-inversion @ git+https://github.com/RittgerLabGroup/spires-inversion.git@967f1a17522eac03ca09a66ec93fed85a2a8b18a",
    "spires-postprocess @ git+https://github.com/RittgerLabGroup/spires-postprocess.git@0acf6854d4672e93116835902495e5673d81857d",
]

[project.scripts]
spires-batch = "spires_batch.cli:main"

[project.urls]
Homepage = "https://github.com/RittgerLabGroup/spires-batch"
Repository = "https://github.com/RittgerLabGroup/spires-batch"

[tool.setuptools.packages.find]
where = ["."]
include = ["spires_batch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
